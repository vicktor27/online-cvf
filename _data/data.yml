experiences:
  title: Experiences
  info:
    - role: Lead Consultant / Tech Lead
      time: Aug 2022 - Mar 2024
      company: Apex Systems (Remote)
      details: |
        Served as Tech Lead and Lead Consultant across multiple software initiatives, combining hands-on development with technical leadership. Led the design and development of RESTful applications using .NET Core 8, PostgreSQL, and React Native, ensuring scalability, performance, and clean architecture. Designed and delivered a React Native bootcamp to upskill development teams. Played a key role in architecting a cloud-based education platform using React.js and Redux, and led frontend initiatives focused on user experience optimization using React, TypeScript, and GraphQL. Provided architectural guidance, integration strategies, and end-to-end ownership across the software development lifecycle.

    - role: Tech Mentor / Web Development Tutor
      time: 2024 - Present
      company: TripleTen (Remote)
      details: |
        Mentor and tutor for Full Stack Web Development programs, guiding students through JavaScript, React, and modern web development practices. Provide 1:1 technical feedback, code reviews, and project guidance focused on clean code, scalability, and real-world application development. Support learners in debugging, system design, and transitioning toward job-ready software engineering skills.

    - role: Full-Time Software Development Instructor
      time: 2017 - Present
      company: Universidad Tecnológica de La Laguna de Durango (UTLD)
      details: |
        Full-time instructor teaching Software Development and Full Stack Engineering aligned with industry practices. Teach frontend and backend development using JavaScript, Node.js, React, .NET Core 8, and RESTful architectures. Cover data modeling and persistence using PostgreSQL, SQL-based systems, and MongoDB. Introduce Python for scripting and data analysis using Jupyter Notebooks, as well as C#/.NET and Unity for applied programming. Teach cybersecurity fundamentals, networking concepts, Git/GitHub workflows, Figma, and Jira. Design and supervise project-based learning, organize academic and industry-focused study trips, and mentor students in software engineering best practices. Recognized as a COCYTED researcher for applied technology and innovation projects.

    - role: Software Development Instructor (Contract)
      time: Jan 2016 - Aug 2022
      company: Universidad Interamericana para el Desarrollo (UNID)
      details: |
        Delivered instruction in Software Development and Full Stack Engineering with a strong focus on hands-on, real-world application. Taught frontend and backend development using HTML5, CSS, JavaScript, PHP (OOP), React, and Node.js. Covered mobile development using Flutter and Kotlin, database systems (SQL and NoSQL), and cloud fundamentals using AWS. Designed project-based learning experiences and mentored students in debugging, problem-solving, and software engineering best practices.

    - role: Software Entrepreneur / Full Stack Developer
      time: Jan 2018 - Aug 2022
      company: Self-employed (ticslaguna) (Remote)
      details: |
        Founded and operated a software services venture focused on healthcare and medical laboratory systems. Led end-to-end design and development of full stack solutions using React, Node.js, MySQL, and RESTful APIs. Architected and deployed cloud-native solutions on AWS using Docker. Led UI/UX collaboration with Figma, managed workflows using Git and Jira, and handled the full software lifecycle from requirements gathering to deployment and maintenance.

    - role: Full Stack Developer
      time: Jan 2013 - Jan 2016
      company: Human Staff
      details: |
        Worked as a Full Stack Developer delivering enterprise web applications using a Microsoft-based technology stack. Built backend services and business logic using C#, ASP.NET Core, and ASP.NET MVC. Designed and maintained SQL Server databases ensuring data integrity and performance. Developed structured and user-friendly web interfaces using HTML and server-side rendering. Contributed across the full development lifecycle and supported production systems.

    - role: Senior Software Developer
      time: Jan 2010 - Jan 2013
      company: IntegraCorp
      details: |
        Specialized in the design, development, and optimization of enterprise business applications using GeneXus 8 and GeneXus X. Led the implementation of scalable, low-code solutions supporting critical operational workflows. Collaborated with stakeholders to translate business requirements into maintainable software solutions and contributed across analysis, development, deployment, and support phases.
