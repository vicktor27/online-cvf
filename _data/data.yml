    Tech Lead and Full Stack Engineer with extensive experience designing, building, and leading scalable software systems across enterprise, consulting, and educational environments. Strong background in backend and frontend architectures using .NET Core 8, Node.js, PostgreSQL, React, and cloud-based solutions. Proven ability to lead technical initiatives, mentor developers, and deliver production-ready systems while bridging engineering execution with business and educational impact.l Stack Developer with comprehensive expertise in the development cycle across web and desktop environments, proficient in a broad spectrum of technologies including HTML5, CSS, Bootstrap, PHP OOP (CodeIgniter, Laravel), JavaScript (jQuery, React, React Native), TypeScript(Angular, React), Flutter, Kotlin, and advanced database management (SQL and NoSQL: MSSQL, MySQL, MariaDB, Firebase, MongoDB), complemented by a strong foundation in project management and customer engagement.

